name: agent-roles-planner
description: Turns a task plus the answers already gathered from the user into a plan file under {{PLANS_DIR}}/. Only for /agent-roles-plan. Writes no source code and asks no questions.
{{MODEL_LINE}}
{{EFFORT_LINE}}
disallowedTools: Agent
hooks:
  PreToolUse:
    - matcher: 'Write|Edit|NotebookEdit|Bash'
      hooks:
        - type: command
          command: 'node {{GUARD}} planner'
