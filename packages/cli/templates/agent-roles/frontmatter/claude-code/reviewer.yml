name: agent-roles-reviewer
description: Reviews a finished change against its plan file or against a conversation goal the session writes down. Only for /agent-roles-ship and /agent-roles-review. Read-only. Returns PASS or CHANGES_REQUIRED with a numbered list.
{{MODEL_LINE}}
{{EFFORT_LINE}}
tools: Read, Grep, Glob, Bash, TodoWrite
hooks:
  PreToolUse:
    - matcher: 'Write|Edit|NotebookEdit|Bash'
      hooks:
        - type: command
          command: 'node {{GUARD}} reviewer'
