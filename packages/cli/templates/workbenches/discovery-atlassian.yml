# The workbench `__MONOCEROS_NAME__`, from the `discovery-atlassian` template.
# This file is the source of truth; the container is built from it. Change it
# here or with `monoceros add-*`, then run `monoceros apply __MONOCEROS_NAME__`.
# https://getmonoceros.build/docs/concepts/configuration/
#
# What is in here: Claude Code, the discovery skills, the three build roles,
# the Atlassian CLI the skills and roles read Jira and Confluence with, and the
# Monoceros docs the technical brief reads the catalog from. That is enough to
# run the discovery from an idea to a cut backlog. The discovery and the roles
# serve OpenCode and Copilot too: add either with `monoceros add-feature`. The stack the
# product itself needs (languages, services, repositories) is not here yet: the
# technical brief decides it, and `monoceros add-*` puts it in afterwards.
# https://getmonoceros.build/from-idea-to-code/

schemaVersion: 1
name: __MONOCEROS_NAME__
# Pinned runtime base image, reused on every apply (never auto-bumped).
# `monoceros upgrade __MONOCEROS_NAME__` refreshes the tooling and moves this to
# the latest runtime when a newer one exists.
runtimeVersion: __MONOCEROS_RUNTIME_VERSION__

# Full catalog and every option: `monoceros list-components`, or the feature
# page linked above each entry.
features:
  # Claude Code, the coding agent the discovery runs in.
  # https://getmonoceros.build/docs/features/claude/
  - ref: ghcr.io/getmonoceros/monoceros-features/claude-code:1
    options:
      permissionMode: auto
      apiKey: ${CLAUDE_CODE_API_KEY}

  # The discovery: the skills that work an idea into a brief, personas and
  # journeys, a domain model, a design brief, a technical brief and a cut
  # backlog, written to Confluence and Jira.
  # https://getmonoceros.build/docs/discovery/overview/
  - ref: ghcr.io/getmonoceros/monoceros-features/discovery-atlassian:1

  # The three roles that build a story: the planner writes the plan, the
  # developer executes it, the reviewer checks the result against it.
  #
  # Planning and reviewing carry the thinking, so they deserve the stronger
  # model; implementing follows a plan that already names the files and the
  # acceptance command, so a cheaper one does. `init` asks for the values; put
  # them in monoceros-config.env to set them once for every workbench.
  # https://getmonoceros.build/docs/features/agent-roles/
  - ref: ghcr.io/getmonoceros/monoceros-features/agent-roles:1
    roles:
      planner:
        claude-code:
          model: ${AGENT_ROLES_CLAUDE_PLANNER_MODEL}
          effort: ${AGENT_ROLES_CLAUDE_PLANNER_EFFORT}
      developer:
        claude-code:
          model: ${AGENT_ROLES_CLAUDE_DEVELOPER_MODEL}
          effort: ${AGENT_ROLES_CLAUDE_DEVELOPER_EFFORT}
      reviewer:
        claude-code:
          model: ${AGENT_ROLES_CLAUDE_REVIEWER_MODEL}
          effort: ${AGENT_ROLES_CLAUDE_REVIEWER_EFFORT}

  # Atlassian: the `twg` CLI on its own, which is how the discovery and the roles
  # read and write Jira and Confluence from in here. Rovo Dev and Forge are
  # deliberately left off; add them with
  # `monoceros add-feature __MONOCEROS_NAME__ atlassian/rovodev` if you want
  # them.
  # https://getmonoceros.build/docs/features/atlassian/
  - ref: ghcr.io/getmonoceros/monoceros-features/atlassian:1
    options:
      rovodev: false
      twg: true
      forge: false
      instance: ${ATLASSIAN_INSTANCE}
      email: ${ATLASSIAN_EMAIL}
      apiToken: ${ATLASSIAN_API_TOKEN}

# The Monoceros docs and component catalog, which the technical brief reads to
# map the stack onto a workbench.
# https://getmonoceros.build/docs/mcp-servers/monoceros-docs/
mcpServers:
  - name: monoceros-docs
