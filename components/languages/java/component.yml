id: java
category: language
displayName: Java
description: 'A JDK plus Maven and Gradle by default, where the upstream feature installs only the JDK, so this is build-ready as it stands. The JDK major is the `version:` field in the yml (`latest`, 21, 17, 11, 8); on the command line it is `java:21`.'
language:
  feature: ghcr.io/devcontainers/features/java:1
  defaultVersion: latest
  versions: [latest, 21, 17, 11, 8]
  vscodeExtensions: [vscjava.vscode-java-pack]
  # Maven's local repository is keyed by group, artifact and version, so one
  # copy serves every workbench on the machine and survives `apply`.
  sharedCachePaths:
    - /home/node/.m2/repository
  # Gradle's home (wrapper distributions, dependency cache) survives `apply`
  # per workbench. Not shared: Gradle locks its cache between processes that
  # have to reach each other, which two containers cannot (#132).
  containerCachePaths:
    - /home/node/.gradle
  cacheMinRuntime: 1.11.0
options:
  installMaven:
    type: boolean
    default: true
    surface: yml
  installGradle:
    type: boolean
    default: true
    surface: yml
