id: node
category: language
displayName: Node.js
description: 'Built into the runtime image. A bare `node` installs nothing extra; pin a different major with `node:<version>`.'
language:
  feature: ghcr.io/devcontainers/features/node:1
  builtin: true
  defaultVersion: 22
  versions: [lts, latest, 22, 20]
  # npm's download cache is content-addressed and safe for concurrent use, so
  # one copy serves every workbench and survives `apply`. node_modules itself
  # lives in the project checkout and needs nothing here.
  sharedCachePaths:
    - /home/node/.npm
  cacheMinRuntime: 1.11.0
